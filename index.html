<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>1oo.re</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@600&display=swap">
<style>
:root{color-scheme:dark;--bg:#111318;--fg:#e9e9ec;--mute:#8f93a3;--accent:#5b6cff;--line:#262a35}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Manrope",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
h1{margin:0;font:700 clamp(44px,10vw,88px)/1 "Unbounded","Manrope",sans-serif;letter-spacing:-.03em}
h1 span{color:var(--accent)}
p{margin:0;font-weight:600;color:var(--mute)}
.bar{width:min(60vw,260px);height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;width:38%;height:100%;background:var(--accent);animation:go 3s ease-in-out infinite alternate}
@keyframes go{to{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<main>
  <h1>1oo<span>.re</span></h1>
  <p>Скоро здесь что-то будет.</p>
  <div class="bar"><i></i></div>
</main>
</body>
</html>
