<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>1oo.re</title>
<link rel="icon" href="rozetka-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap">
<style>
/* Оформление «Розетка» (по мотивам новой 100 ₽, 26.10.2026): кремовая бумага, оливковая надпись, оранжевый акцент, волна гильоша */
:root{--bg:#f4eedc;--fg:#424a2d;--mute:#6c6f55;--olive2:#858a50;--accent:#d88c48;--line:#ddd5bb}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1c1f14;--fg:#e4e0c4;--mute:#b3b296;--olive2:#8f9458;--line:#3a3f2a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Manrope",system-ui,sans-serif;display:grid;place-items:center;
     padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.mark{width:clamp(120px,30vw,180px);height:auto;border-radius:50%}
h1{margin:0;font:800 clamp(48px,11vw,92px)/1 "Manrope",system-ui,sans-serif;letter-spacing:-.04em}
.micro{width:min(78vw,420px);font:600 9px/1 "Manrope",system-ui,sans-serif;letter-spacing:.08em;color:var(--olive2);
       white-space:nowrap;overflow:hidden;border-top:1px solid var(--olive2);padding-top:4px}
.wave{width:min(78vw,420px);height:18px}
.wave path{fill:none;stroke-width:1}
p{margin:0;font-weight:600;color:var(--mute)}
.bar{width:min(60vw,260px);height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;width:38%;height:100%;background:var(--accent);animation:go 3s ease-in-out infinite alternate}
@keyframes go{to{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<main>
  <img class="mark" src="rozetka-512.png" alt="" width="180" height="180">
  <h1>1oo.re</h1>
  <div class="micro" aria-hidden="true">1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re 1oo.re</div>
  <svg class="wave" viewBox="0 0 420 18" preserveAspectRatio="none" aria-hidden="true">
    <path stroke="var(--olive2)" d="M0 9 C 26 1, 52 1, 78 9 S 130 17, 156 9 S 208 1, 234 9 S 286 17, 312 9 S 364 1, 390 9 S 414 13, 420 11"/>
    <path stroke="var(--accent)" d="M0 9 C 26 17, 52 17, 78 9 S 130 1, 156 9 S 208 17, 234 9 S 286 1, 312 9 S 364 17, 390 9 S 414 5, 420 7"/>
  </svg>
  <p>Скоро здесь что-то будет.</p>
  <div class="bar"><i></i></div>
</main>
</body>
</html>
